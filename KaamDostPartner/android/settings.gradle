pluginManagement {
    includeBuild(file('../node_modules/@react-native/gradle-plugin').exists()
        ? '../node_modules/@react-native/gradle-plugin'
        : '../../node_modules/@react-native/gradle-plugin')
}

plugins {
    id("com.facebook.react.settings")
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

def nodeModules = file('../node_modules/react-native').exists()
    ? file('../node_modules')
    : file('../../node_modules')

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(
        ["node", "${nodeModules}/@react-native-community/cli/build/bin.js".toString(), "config"],
        settingsDir.parentFile
    )
}

rootProject.name = 'KaamDostPartner'
include ':app'

includeBuild(file('../node_modules/@react-native/gradle-plugin').exists()
    ? file('../node_modules/@react-native/gradle-plugin')
    : file('../../node_modules/@react-native/gradle-plugin'))
