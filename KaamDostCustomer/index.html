<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KaamDost Customer App — Live Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at 10% 20%, #dbeafe 0%, #eff6ff 40%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f294a;
      padding: 20px;
      overflow-x: hidden;
    }
    .preview-header {
      margin-bottom: 16px;
      text-align: center;
    }
    .preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
      font-size: 13px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 8px;
      border: 1px solid #bfdbfe;
    }
    .preview-badge span {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
    }
    .preview-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f294a;
      letter-spacing: -0.5px;
    }
    .preview-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .phone-mockup {
      width: 412px;
      height: 860px;
      max-width: 100vw;
      max-height: 92vh;
      background: #ffffff;
      border-radius: 46px;
      box-shadow: 0 25px 60px -15px rgba(15, 41, 74, 0.25), 0 0 0 10px #0f172a, 0 0 0 12px #334155;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Phone Dynamic Island / Notch */
    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 26px;
      background: #0f172a;
      border-radius: 20px;
      z-index: 9999;
      pointer-events: none;
    }
    #root {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #f0f7ff;
    }
    @media (max-width: 480px) {
      body {
        padding: 0;
        background: #f0f7ff;
      }
      .preview-header {
        display: none;
      }
      .phone-mockup {
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
      .phone-notch {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <div class="preview-badge">
      <span></span> KaamDost 27-Screen Interactive Preview
    </div>
    <h1 class="preview-title">Customer App Experience</h1>
    <p class="preview-sub">Click and interact directly through Onboarding, Discovery, Booking, Tracking & Account</p>
  </div>

  <div class="phone-mockup">
    <div class="phone-notch"></div>
    <div id="root"></div>
  </div>

  <script type="module" src="/index.web.js"></script>
</body>
</html>
